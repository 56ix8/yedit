[package]
name = "yedit-cli"
description = "Headless YEDIT: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional yedit-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["yedit-codecs/heif"]

[lints]
workspace = true

[lib]
name = "yedit_cli"
path = "src/lib.rs"

[[bin]]
name = "yedit-cli"
path = "src/main.rs"

[dependencies]
yedit-automation = { path = "../../crates/automation" }
yedit-engine = { workspace = true }
yedit-io = { workspace = true }
yedit-format = { path = "../../crates/format" }
yedit-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# Synthetic camera raws (#7789).
yedit-raw = { workspace = true, features = ["testgen"] }

[build-dependencies]
# Icon + VERSIONINFO for yedit-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
