[book]
authors = ["PhotoCraft contributors"]
language = "en"
multilingual = false
src = "src"
title = "YEDIT Documentation"

[build]
build-dir = "output"
create-missing = false

[output.html]
preferred-dark-theme = "navy"
smart-punctuation = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
